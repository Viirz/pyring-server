<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Users Management</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/account.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/users.css') }}" />
</head>
<body>
  <header class="navbar">
    <h1>Command Center</h1>
    <nav>
      <a href="{{ url_for('web.dashboard') }}" class="active">
        <img src="{{ url_for('static', filename='img/dashboard.png') }}" class="icon"> Dashboard
      </a>
      <a href="{{ url_for('web.users_page') }}">
        <img src="{{ url_for('static', filename='img/user.png') }}" class="icon"> Users
      </a>
      <a href="{{ url_for('web.account') }}">
        <img src="{{ url_for('static', filename='img/user.png') }}" class="icon"> User
      </a>
    </nav>
  </header>

  <main class="settings-container" id="usersPage"
        data-list-url="{{ url_for('users_api.list_users_route') }}"
        data-create-url="{{ url_for('users_api.create_user_route') }}"
        data-delete-url-template="{{ url_for('users_api.delete_user_route', email='__EMAIL__') }}">
    <div class="settings-card users-card">
      <div class="users-header">
        <div>
          <h3>Users</h3>
          <p>Manage all users and their roles</p>
        </div>
        <button id="toggleCreateBtn" class="btn-green" onclick="toggleCreate()">Add User</button>
      </div>

      <table class="users-table">
        <thead>
          <tr>
            <th style="width: 28%">Name</th>
            <th style="width: 44%">Email</th>
            <th style="width: 16%">Role</th>
            <th style="width: 12%; text-align: center;">Action</th>
          </tr>
        </thead>
        <tbody id="usersTableBody">
          <!-- Filled by JS -->
        </tbody>
      </table>
    </div>

    <!-- Create User Card (hidden by default) -->
    <div id="createUserCard" class="settings-card hidden">
      <h3>Create User</h3>
      <div class="telegram-settings">
        <label>Name</label>
        <input id="name" type="text" placeholder="Full name" />
        <label>Email</label>
        <input id="email" type="email" placeholder="Email address" />
        <label>Password</label>
        <input id="password" type="password" placeholder="Password" />
        <label>Repeat Password</label>
        <input id="repeat_password" type="password" placeholder="Repeat Password" />
        <label>Role</label>
        <select id="role">
          <option value="user">user</option>
          <option value="admin">admin</option>
          <option value="super-admin">super-admin</option>
        </select>
        <div class="mt-12">
          <button class="btn-save" onclick="createUser()">Create</button>
        </div>
      </div>
    </div>
  </main>
  <script src="{{ url_for('static', filename='js/users.js') }}"></script>
</body>
</html>
