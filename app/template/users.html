<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Users Management</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/account.css') }}" />
  <style>
    /* Minimal table + button styles specific to this page */
    .users-card { background: #fff; border-radius: 8px; padding: 16px; }
    .users-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .users-table { width: 100%; border-collapse: collapse; }
    .users-table th, .users-table td { padding: 12px; border-bottom: 1px solid #eee; text-align: left; }
    .users-table th { background: #f8f9fa; }
    .btn-green { background: #28a745; color: #fff; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: 600; }
    .btn-green:hover { background: #218838; }
    .btn-red { background: #dc3545; color: #fff; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: 600; }
    .btn-red:hover { background: #c82333; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <header class="navbar">
    <h1>Command Center</h1>
    <nav>
      <a href="{{ url_for('web.dashboard') }}" class="active">
        <img src="{{ url_for('static', filename='img/dashboard.png') }}" class="icon"> Dashboard
      </a>
      <a href="{{ url_for('web.users_page') }}">
        <img src="{{ url_for('static', filename='img/user.png') }}" class="icon"> Users
      </a>
      <a href="{{ url_for('web.account') }}">
        <img src="{{ url_for('static', filename='img/user.png') }}" class="icon"> User
      </a>
    </nav>
  </header>

  <main class="settings-container">
    <div class="settings-card users-card">
      <div class="users-header">
        <div>
          <h3>Users</h3>
          <p>Manage all users and their roles</p>
        </div>
        <button id="toggleCreateBtn" class="btn-green" onclick="toggleCreate()">Add User</button>
      </div>

      <table class="users-table">
        <thead>
          <tr>
            <th style="width: 28%">Name</th>
            <th style="width: 44%">Email</th>
            <th style="width: 16%">Role</th>
            <th style="width: 12%; text-align: center;">Action</th>
          </tr>
        </thead>
        <tbody id="usersTableBody">
          <!-- Filled by JS -->
        </tbody>
      </table>
    </div>

    <!-- Create User Card (hidden by default) -->
    <div id="createUserCard" class="settings-card hidden">
      <h3>Create User</h3>
      <div class="telegram-settings">
        <label>Name</label>
        <input id="name" type="text" placeholder="Full name" />
        <label>Email</label>
        <input id="email" type="email" placeholder="Email address" />
        <label>Password</label>
        <input id="password" type="password" placeholder="Password" />
        <label>Repeat Password</label>
        <input id="repeat_password" type="password" placeholder="Repeat Password" />
        <label>Role</label>
        <select id="role">
          <option value="user">user</option>
          <option value="admin">admin</option>
          <option value="super-admin">super-admin</option>
        </select>
        <div style="margin-top: 12px;">
          <button class="btn-save" onclick="createUser()">Create</button>
        </div>
      </div>
    </div>
  </main>

  <script>
    async function loadUsers() {
      try {
        const resp = await fetch('{{ url_for("users_api.list_users_route") }}', {
          method: 'GET',
          credentials: 'include'
        });
        const data = await resp.json();
        if (!resp.ok) {
          alert(data.msg || 'Failed to load users');
          return;
        }
        const tbody = document.getElementById('usersTableBody');
        tbody.innerHTML = '';
        data.forEach(u => {
          const tr = document.createElement('tr');

          const nameTd = document.createElement('td');
          nameTd.textContent = u.name || '';
          tr.appendChild(nameTd);

          const emailTd = document.createElement('td');
          emailTd.textContent = u.email || '';
          tr.appendChild(emailTd);

          const roleTd = document.createElement('td');
          roleTd.textContent = u.role || 'user';
          tr.appendChild(roleTd);

          const actionTd = document.createElement('td');
          actionTd.style.textAlign = 'center';
          const delBtn = document.createElement('button');
          delBtn.className = 'btn-red';
          delBtn.textContent = 'Delete';
          delBtn.onclick = () => deleteUser(u.email);
          actionTd.appendChild(delBtn);
          tr.appendChild(actionTd);

          tbody.appendChild(tr);
        });
      } catch (e) {
        alert('Error: ' + e.message);
      }
    }

    function toggleCreate() {
      const card = document.getElementById('createUserCard');
      card.classList.toggle('hidden');
    }

    async function createUser() {
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const repeat_password = document.getElementById('repeat_password').value;
      const role = document.getElementById('role').value;

      if (!name || !email || !password || !repeat_password || !role) {
        alert('All fields are required');
        return;
      }

      try {
        const resp = await fetch('{{ url_for("users_api.create_user_route") }}', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ name, email, password, repeat_password, role })
        });
        const result = await resp.json();
        if (resp.ok) {
          alert('User created');
          // Reset form
          document.getElementById('name').value = '';
          document.getElementById('email').value = '';
          document.getElementById('password').value = '';
          document.getElementById('repeat_password').value = '';
          document.getElementById('role').value = 'user';
          // Hide card and refresh list
          document.getElementById('createUserCard').classList.add('hidden');
          loadUsers();
        } else {
          alert(result.msg || 'Failed to create user');
        }
      } catch (e) {
        alert('Error: ' + e.message);
      }
    }

    async function deleteUser(email) {
      if (!confirm(`Delete user "${email}"? This action cannot be undone.`)) return;
      try {
        const resp = await fetch(`{{ url_for("users_api.delete_user_route", email="__EMAIL__") }}`.replace('__EMAIL__', encodeURIComponent(email)), {
          method: 'DELETE',
          credentials: 'include'
        });
        const result = await resp.json();
        if (resp.ok) {
          loadUsers();
        } else {
          alert(result.msg || 'Failed to delete user');
        }
      } catch (e) {
        alert('Error: ' + e.message);
      }
    }

    document.addEventListener('DOMContentLoaded', loadUsers);
  </script>
</body>
</html>
