<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Account Settings</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/account.css') }}" />
</head>
<body>
  <header class="navbar">
    <h1>Command Center</h1>
    <nav>
      <a href="{{ url_for('web.dashboard') }}" class="active">
        <img src="{{ url_for('static', filename='img/dashboard.png') }}" alt="Dashboard Icon" class="icon"> Dashboard
      </a>
      <a href="{{ url_for('web.account') }}">
        <img src="{{ url_for('static', filename='img/user.png') }}" alt="User Icon" class="icon"> User
      </a>
    </nav>
  </header>

  <main class="settings-container">
    <!-- Header Row: Title, Description & Logout Button -->
    <div class="header-row">
      <div>
        <h2>Account Settings</h2>
        <p>Manage your account settings and notifications</p>
      </div>
      <!-- Logout Form -->
      <form action="{{ url_for('users_api.logout_route') }}" method="POST" style="display: inline;">
        <button type="submit" class="btn-logout">Logout</button>
      </form>
    </div>

    <!-- Email Section -->
    <div class="settings-card">
      <label>Email Address</label>
      <div class="email-section">
        <span>{{ email }}</span>
      </div>
    </div>

    <!-- Telegram Notifications Section -->
    <div class="settings-card">
      <h3>Telegram Notifications</h3>
      <p class="section-description">Get notified when agent status changes</p>
      
      <div class="telegram-settings">
        <div class="toggle-section">
          <label class="toggle-label">
            <span>Enable Notifications</span>
            <div class="toggle-switch">
              <input type="checkbox" id="telegram-enabled">
              <span class="slider"></span>
            </div>
          </label>
        </div>
                <div id="telegram-config" class="telegram-config">
          <label>Bot Token</label>
          <input type="text" id="bot-token" placeholder="Enter your Telegram bot token" />
          
          <label>Chat ID</label>
          <input type="text" id="chat-id" placeholder="Enter your chat ID" />
          
          <label>Thread ID (Optional)</label>
          <input type="text" id="thread-id" placeholder="Enter thread ID for forum topics (optional)" />
          
          <div class="button-group">
            <button type="button" class="btn-test" onclick="testTelegramConnection()">Test Connection</button>
            <button type="button" class="btn-full" onclick="saveTelegramSettings()">Save Settings</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Password Form -->
    <div class="settings-card">
      <h3>Change Password</h3>
      <form id="password-form">
        <label>Current Password</label>
        <input type="password" id="current-password" placeholder="Current Password" required />
    
        <label>New Password</label>
        <input type="password" id="new-password" placeholder="New Password" required />
    
        <label>Confirm New Password</label>
        <input type="password" id="confirm-password" placeholder="Confirm New Password" required />
    
        <button type="button" class="btn-full" onclick="updatePassword()">Update Password</button>
      </form>
    </div>

  </main>
</body>

<script>
  // Global variable to track if settings are configured
  let telegramConfigured = false;
  let isLoadingSettings = false; // Flag to prevent auto-save during loading

  // Load Telegram settings on page load
  document.addEventListener('DOMContentLoaded', function() {
    // Add event listener for toggle AFTER loading settings
    loadTelegramSettings().then(() => {
      // Add the event listener after settings are loaded
      document.getElementById('telegram-enabled').addEventListener('change', onToggleChange);
    });
  });

  async function loadTelegramSettings() {
    isLoadingSettings = true; // Set flag to prevent auto-save
    
    try {
      const response = await fetch('/api/telegram/settings', {
        method: 'GET',
        credentials: 'include'
      });

      if (response.ok) {
        const settings = await response.json();
        
        // Set the enabled checkbox
        document.getElementById('telegram-enabled').checked = settings.enabled || false;
        
        // Handle bot token - check if it's configured
        const botTokenInput = document.getElementById('bot-token');
        if (settings.bot_token && settings.bot_token !== '') {
          telegramConfigured = true;
          botTokenInput.value = settings.bot_token; // This will be "***CONFIGURED***" if already set
          botTokenInput.placeholder = 'Bot token configured (enter new token to change)';
        } else {
          telegramConfigured = false;
          botTokenInput.value = '';
          botTokenInput.placeholder = 'Enter your Telegram bot token';
        }
        
        // Set chat ID
        document.getElementById('chat-id').value = settings.chat_id || '';
        
        // Set thread ID (new field)
        document.getElementById('thread-id').value = settings.thread_id || '';
        
        // Update UI visibility AFTER setting the checkbox value
        toggleTelegramConfig();
        
        console.log('Telegram settings loaded:', {
          enabled: settings.enabled,
          botTokenConfigured: telegramConfigured,
          chatId: settings.chat_id,
          threadId: settings.thread_id
        });
      } else {
        console.error('Failed to load Telegram settings:', response.status);
        // Still call toggleTelegramConfig to ensure proper initial state
        toggleTelegramConfig();
      }
    } catch (error) {
      console.error('Error loading Telegram settings:', error);
      // Still call toggleTelegramConfig to ensure proper initial state
      toggleTelegramConfig();
    } finally {
      isLoadingSettings = false; // Clear the flag
    }
  }

  function onToggleChange() {
    // Don't auto-save if we're currently loading settings
    if (isLoadingSettings) {
      return;
    }
    
    const enabled = document.getElementById('telegram-enabled').checked;
    
    // Update UI visibility
    toggleTelegramConfig();
    
    // Only auto-save when DISABLING notifications
    if (!enabled) {
      autoSaveDisableNotifications();
    }
    // When enabling, just show the config section - user must click Save Settings
  }

  function toggleTelegramConfig() {
    const enabled = document.getElementById('telegram-enabled').checked;
    const config = document.getElementById('telegram-config');
    
    console.log('Toggle called - enabled:', enabled); // Debug log
    
    if (enabled) {
      config.style.display = 'block';
      config.style.animation = 'fadeIn 0.3s ease-in';
    } else {
      config.style.display = 'none';
    }
  }

  async function autoSaveDisableNotifications() {
    try {
      // When disabling, we preserve existing credentials but set enabled = false
      const botToken = document.getElementById('bot-token').value;
      const chatId = document.getElementById('chat-id').value;
      const threadId = document.getElementById('thread-id').value;

      const response = await fetch('/api/telegram/settings', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({
          enabled: false,  // Always false when auto-saving disable
          bot_token: botToken,
          chat_id: chatId,
          thread_id: threadId
        }),
        credentials: 'include'
      });

      if (response.ok) {
        console.log('Telegram notifications disabled automatically');
        // Show a subtle notification
        const toggle = document.querySelector('.toggle-label span');
        const originalText = toggle.textContent;
        toggle.textContent = 'Notifications Disabled';
        setTimeout(() => {
          toggle.textContent = originalText;
        }, 2000);
      } else {
        const result = await response.json();
        console.error('Auto-save disable failed:', result.msg);
        // Revert the checkbox if save failed
        document.getElementById('telegram-enabled').checked = true;
        toggleTelegramConfig();
        alert('Failed to disable notifications: ' + result.msg);
      }
    } catch (error) {
      console.error('Error auto-disabling Telegram settings:', error);
      // Revert the checkbox if save failed
      document.getElementById('telegram-enabled').checked = true;
      toggleTelegramConfig();
      alert('Error disabling notifications. Please try again.');
    }
  }

  async function testTelegramConnection() {
    const botToken = document.getElementById('bot-token').value;
    const chatId = document.getElementById('chat-id').value;
    const threadId = document.getElementById('thread-id').value;

    if (!botToken || !chatId) {
      alert('Please enter both bot token and chat ID');
      return;
    }

    // Show loading state
    const testButton = document.querySelector('.btn-test');
    const originalText = testButton.textContent;
    testButton.textContent = 'Testing...';
    testButton.disabled = true;

    try {
      const response = await fetch('/api/telegram/test', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({
          bot_token: botToken,
          chat_id: chatId,
          thread_id: threadId
        }),
        credentials: 'include'
      });

      const result = await response.json();
      
      if (response.ok) {
        alert('✅ ' + result.message);
      } else {
        alert('❌ ' + result.message);
      }
    } catch (error) {
      alert('❌ Connection error: ' + error.message);
    } finally {
      // Reset button state
      testButton.textContent = originalText;
      testButton.disabled = false;
    }
  }

  async function saveTelegramSettings() {
    const enabled = document.getElementById('telegram-enabled').checked;
    const botToken = document.getElementById('bot-token').value;
    const chatId = document.getElementById('chat-id').value;
    const threadId = document.getElementById('thread-id').value;

    if (enabled && (!botToken || !chatId)) {
      alert('Please enter both bot token and chat ID when enabling notifications');
      return;
    }

    // Show loading state
    const saveButton = document.querySelector('.telegram-config .btn-full');
    const originalText = saveButton.textContent;
    saveButton.textContent = 'Saving...';
    saveButton.disabled = true;

    try {
      const response = await fetch('/api/telegram/settings', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({
          enabled: enabled,
          bot_token: botToken,
          chat_id: chatId,
          thread_id: threadId
        }),
        credentials: 'include'
      });

      const result = await response.json();
      
      if (response.ok) {
        alert('✅ ' + result.msg);
        // Reload settings to show masked token and update UI
        await loadTelegramSettings();
      } else {
        alert('❌ ' + result.msg);
      }
    } catch (error) {
      alert('❌ Error saving settings: ' + error.message);
    } finally {
      // Reset button state
      saveButton.textContent = originalText;
      saveButton.disabled = false;
    }
  }

  async function updatePassword() {
    // Gather form data
    const oldPassword = document.getElementById('current-password').value;
    const newPassword = document.getElementById('new-password').value;
    const confirmPassword = document.getElementById('confirm-password').value;

    // Check if new password and confirm password match
    if (newPassword !== confirmPassword) {
      alert('New password and confirm password do not match.');
      return;
    }

    // Show loading state
    const updateButton = document.querySelector('#password-form .btn-full');
    const originalText = updateButton.textContent;
    updateButton.textContent = 'Updating...';
    updateButton.disabled = true;

    try {
      // Send the data as JSON to the endpoint
      const response = await fetch('{{ url_for("users_api.change_password_route") }}', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({
          old_password: oldPassword,
          new_password: newPassword,
        }),
        credentials: 'include', // Include cookies in the request
      });

      // Handle the response
      if (response.ok) {
        alert('Password updated successfully!');
        // Clear the form
        document.getElementById('current-password').value = '';
        document.getElementById('new-password').value = '';
        document.getElementById('confirm-password').value = '';
      } else {
        const errorData = await response.json();
        alert(errorData.msg || 'Failed to update password.');
      }
    } catch (error) {
      console.error('Error updating password:', error);
      alert('An error occurred. Please try again.');
    } finally {
      // Reset button state
      updateButton.textContent = originalText;
      updateButton.disabled = false;
    }
  }
</script>
</html>
